name: Herbal-AI CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

env:
  AWS_REGION: us-east-1
  BACKEND_ECR_REPOSITORY: herbalai-prod-backend
  FRONTEND_ECR_REPOSITORY: herbalai-prod-frontend

jobs:
  test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "black==25.9.0" pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull DVC artifacts
        run: |
          dvc pull

      - name: Check formatting with Black
        run: |
          black --check \
            ai/mlflow_tracking.py \
            ai/image_classifier/trainer.py \
            ai/image_classifier/evaluate.py \
            ai/herb/training/trainer.py \
            ai/herb/scripts/evaluate.py \
            ai/training/train.py \
            ai/training/evaluate.py \
            ai/scripts/verify_model_loads.py \
            ai/scripts/register_models.py \
            ai/scripts/verify_registry_models.py

      - name: Compile Python code
        run: |
          python -m compileall -q ai backend tests

      - name: Run tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m pytest tests -v

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DVC
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[s3]==3.67.1"

      - name: Pull production model artifacts
        run: |
          dvc pull train_universal train_skin train_herb

      - name: Verify production model artifacts
        run: |
          test -f ai/image_classifier/checkpoints/best_model.pth
          test -f ai/checkpoints/best_model.pth
          test -f ai/herb/checkpoints/best_model.pth

          echo "Universal model:"
          sha256sum ai/image_classifier/checkpoints/best_model.pth

          echo "Skin model:"
          sha256sum ai/checkpoints/best_model.pth

          echo "Herb model:"
          sha256sum ai/herb/checkpoints/best_model.pth

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------- BACKEND ----------------

      - name: Build backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile.prod \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:latest \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }} \
            .

      - name: Push backend Docker images
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:latest

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }}

      # ---------------- FRONTEND ----------------

      - name: Build frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            --build-arg CLERK_SECRET_KEY="${{ secrets.CLERK_SECRET_KEY }}" \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:latest \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }} \
            ./frontend

      - name: Push frontend Docker images
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:latest

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/Herbal-AI

            echo "Logging in to Amazon ECR..."

            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin \
              335752668496.dkr.ecr.us-east-1.amazonaws.com

            echo "Pulling latest production images..."

            docker compose pull backend frontend

            echo "Restarting application..."

            docker compose up -d backend frontend

            echo "Waiting for backend health..."

            sleep 30

            echo "Checking backend health..."

            curl --fail --silent --show-error \
              http://localhost:8000/health

            echo ""

            echo "Checking frontend..."

            curl --fail --silent --show-error \
              http://localhost:3000

            echo ""

            echo "Cleaning unused Docker images..."

            docker image prune -f

            echo ""

            echo "Deployment successful!"