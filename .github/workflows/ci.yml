name: Herbal-AI CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "black==25.9.0" pytest

      # 4. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 5. Pull DVC artifacts
      - name: Pull DVC artifacts
        run: |
          dvc pull   

      # 6. Black formatting check
      
      - name: Check formatting with Black
        run: |
          black --check \
            ai/mlflow_tracking.py \
            ai/image_classifier/trainer.py \
            ai/image_classifier/evaluate.py \
            ai/herb/training/trainer.py \
            ai/herb/scripts/evaluate.py \
            ai/training/train.py \
            ai/training/evaluate.py \
            ai/scripts/verify_model_loads.py \
            ai/scripts/register_models.py \
            ai/scripts/verify_registry_models.py

      # 7. Compile Python code
      - name: Compile Python code
        run: |
          python -m compileall -q ai backend tests

      # 8. Run test suite
      - name: Run tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m pytest tests -v