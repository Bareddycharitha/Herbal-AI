name: Herbal-AI CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: herbalai-prod-backend

jobs:
  test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "black==25.9.0" pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull DVC artifacts
        run: |
          dvc pull

      - name: Check formatting with Black
        run: |
          black --check \
            ai/mlflow_tracking.py \
            ai/image_classifier/trainer.py \
            ai/image_classifier/evaluate.py \
            ai/herb/training/trainer.py \
            ai/herb/scripts/evaluate.py \
            ai/training/train.py \
            ai/training/evaluate.py \
            ai/scripts/verify_model_loads.py \
            ai/scripts/register_models.py \
            ai/scripts/verify_registry_models.py

      - name: Compile Python code
        run: |
          python -m compileall -q ai backend tests

      - name: Run tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m pytest tests -v

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile.prod \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            .

      - name: Push Docker images
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/Herbal-AI

            echo "Logging in to Amazon ECR..."
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin \
              335752668496.dkr.ecr.us-east-1.amazonaws.com

            echo "Pulling latest backend image..."
            docker compose pull backend

            echo "Restarting backend..."
            docker compose up -d backend

            echo "Waiting for backend health..."
            sleep 10

                        echo "Checking backend health..."
            curl --fail --silent --show-error \
              http://localhost:8000/health

            echo ""
            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo ""
            echo "Deployment successful!"