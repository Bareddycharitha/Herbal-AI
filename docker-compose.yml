services:

  backend:
    image: 335752668496.dkr.ecr.us-east-1.amazonaws.com/herbalai-prod-backend:latest
    container_name: herbal-ai-backend

    ports:
      - "8000:8000"

    volumes:
      - ./ai/datasets/SkinDisease:/app/ai/datasets/SkinDisease:ro

    env_file:
      - .env

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  frontend:
    image: 335752668496.dkr.ecr.us-east-1.amazonaws.com/herbalai-prod-frontend:latest
    container_name: herbal-ai-frontend

    ports:
      - "3000:3000"

    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}

    restart: unless-stopped